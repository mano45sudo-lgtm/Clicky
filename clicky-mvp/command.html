<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeyClicky</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #0b1220;
        color: #e5e7eb;
        font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #1f2a44;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
      header .dot.listening { background: #34d399; }
      header .dot.thinking { background: #fbbf24; }
      header .dot.speaking { background: #60a5fa; }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; }
      header .status { margin-left: auto; font-size: 12px; color: #94a3b8; }

      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .msg { max-width: 90%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
      .msg.user { align-self: flex-end; background: #1d4ed8; color: #fff; }
      .msg.clicky { align-self: flex-start; background: #111827; border: 1px solid #1f2a44; }
      .msg.sys { align-self: center; background: transparent; color: #94a3b8; font-size: 12px; }
      .msg.agent { align-self: flex-start; background: #0f213a; border: 1px solid #1e3a5f; }
      .msg.agent .step { color: #93c5fd; }
      .msg.agent .step.done { color: #34d399; }
      .msg.agent .step.error { color: #f87171; }

      footer { border-top: 1px solid #1f2a44; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
      #input { flex: 1 1 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #1f2a44; background: #0f172a; color: #e5e7eb; font: inherit; }
      button { padding: 8px 14px; border-radius: 10px; border: 1px solid #1f2a44; background: #111827; color: #e5e7eb; font: inherit; cursor: pointer; }
      button:hover { background: #1f2a44; }
      button.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
      button.primary:hover { background: #2563eb; }
      button.danger { color: #fca5a5; }
      .hint { font-size: 11px; color: #64748b; padding: 0 16px 10px; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1>HeyClicky</h1>
      <span class="status" id="status">idle</span>
    </header>

    <div id="log"></div>

    <footer>
      <input id="input" placeholder="Ask about your screen, or give the agent a goal..." />
      <button class="primary" id="askBtn">Ask</button>
      <button id="walkBtn">Walk me through</button>
      <button id="agentBtn">Run Agent</button>
      <button class="danger" id="stopBtn">Stop</button>
    </footer>
    <div class="hint">Tip: hold Ctrl anywhere on your desktop and speak, or type here.</div>

    <script src="command.js"></script>
  </body>
</html>
