<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicky MVP</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 42px;
        height: 42px;
        transform-origin: 50% 50%;
        will-change: transform;
        pointer-events: none;
      }

      /* Full-screen layers for agent drawing and cursor guidance. */
      #draw,
      #fx {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      #draw { z-index: 0; }
      #fx { z-index: 1; }

      body[data-state="listening"] canvas { filter: drop-shadow(0 0 6px #34d399); }
      body[data-state="thinking"]  canvas { filter: drop-shadow(0 0 6px #fbbf24); }
      body[data-state="speaking"]  canvas { filter: drop-shadow(0 0 6px #60a5fa); }

      #caption {
        position: fixed;
        top: 0;
        left: 0;
        max-width: 340px;
        margin: 0;
        padding: 7px 13px 9px;
        border-radius: 13px;
        border-top-left-radius: 4px;
        background: #ecfdf5;
        color: #047857;
        border: 1px solid rgba(16, 185, 129, 0.45);
        font: 600 13.5px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        white-space: pre-wrap;
        word-wrap: break-word;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
        will-change: transform;
        pointer-events: none;
        opacity: 0;
        transform: translate3d(-9999px, -9999px, 0);
        transition: opacity 140ms ease;
      }

      #caption .label {
        display: block;
        margin-bottom: 2px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      body[data-state="thinking"] #caption { background: #fffbeb; color: #b45309; border-color: rgba(245, 158, 11, 0.5); }
      body[data-state="speaking"] #caption { background: #f0f9ff; color: #0369a1; border-color: rgba(14, 165, 233, 0.5); }
      body[data-state="listening"] #caption { background: #ecfdf5; color: #047857; border-color: rgba(52, 211, 153, 0.6); }

      #caption.visible { opacity: 1; }

      #ring {
        position: fixed;
        top: 0;
        left: 0;
        border: 4px solid #38bdf8;
        border-radius: 12px;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.28), 0 0 22px rgba(56, 189, 248, 0.6);
        pointer-events: none;
        opacity: 0;
        transition: opacity 160ms ease;
        will-change: transform;
      }
      #ring .tag {
        position: absolute;
        left: 0;
        bottom: calc(100% + 6px);
        padding: 3px 8px;
        border-radius: 8px;
        background: #38bdf8;
        color: #082f49;
        font: 600 12px/1.2 system-ui, "Segoe UI", sans-serif;
        white-space: nowrap;
      }
      #ring.visible { opacity: 1; }

      #agent {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: 320px;
        max-height: 40vh;
        overflow: hidden;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(17, 24, 39, 0.92);
        color: #e5e7eb;
        font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        pointer-events: none;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 160ms ease, transform 160ms ease;
      }
      #agent.visible { opacity: 1; transform: translateY(0); }
      #agent .h { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #93c5fd; margin-bottom: 6px; }
      #agent .goal { margin: 0 0 8px; color: #f9fafb; }
      #agent .goal.err { color: #fca5a5; }
      #agent ul { margin: 0; padding-left: 16px; }
      #agent li { list-style: disc; margin: 2px 0; color: #d1d5db; }
      #agent li.running { color: #fbbf24; }
      #agent li.done { color: #34d399; }
      #agent li.error { color: #f87171; }
      #agent li.preview { color: #93c5fd; list-style: none; margin-left: -16px; }
      #agent.confirming { background: rgba(60, 12, 16, 0.95); box-shadow: 0 0 0 2px #ef4444, 0 8px 30px rgba(0, 0, 0, 0.5); animation: clickyPulse 1.1s ease-in-out infinite; }
      #agent.confirming .goal { color: #fecaca; font-weight: 600; }
      @keyframes clickyPulse { 0%, 100% { box-shadow: 0 0 0 2px #ef4444, 0 8px 30px rgba(0, 0, 0, 0.5); } 50% { box-shadow: 0 0 0 4px #f87171, 0 8px 30px rgba(0, 0, 0, 0.5); } }
    </style>
  </head>
  <body data-state="idle">
    <canvas id="draw" aria-hidden="true"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <canvas id="clicky" width="84" height="84" aria-hidden="true"></canvas>
    <div id="caption" role="status" aria-live="polite">
      <span class="label"></span>
      <span class="text"></span>
    </div>
    <div id="ring"><span class="tag"></span></div>
    <div id="agent">
      <div class="h">Clicky Agent</div>
      <div class="goal"></div>
      <ul></ul>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
